<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gaglidom · Notícias</title>
  <link rel="stylesheet" href="styles.css?v=202608152041" />
  <script src="password-gate.js?v=202608152041"></script>
</head>
<body>
  <div class="hub hub-wide">
    <a href="index.html" class="hub-logo">gagli<span>dom</span></a>
    <p class="hub-page-title">📰 Notícias</p>
    <p class="hub-page-subtitle">
      Configure as fontes, categorias e frequência de envio das notícias pelo WhatsApp.
    </p>

    <form id="news-form" class="flight-form news-form">
      <fieldset class="news-fieldset">
        <legend>Fontes de notícia</legend>
        <div class="news-checkbox-grid" id="sources-grid"></div>
      </fieldset>

      <fieldset class="news-fieldset">
        <legend>Tipos de notícia</legend>
        <div class="news-checkbox-grid" id="categories-grid"></div>
      </fieldset>

      <div class="flight-form-row">
        <div class="form-field">
          <label for="frequency">Frequência de busca e envio</label>
          <select id="frequency">
            <option value="1">A cada 1 hora</option>
            <option value="2" selected>A cada 2 horas</option>
            <option value="3">A cada 3 horas</option>
            <option value="4">A cada 4 horas</option>
            <option value="6">A cada 6 horas</option>
            <option value="8">A cada 8 horas</option>
            <option value="12">A cada 12 horas</option>
            <option value="24">A cada 24 horas</option>
          </select>
        </div>
        <div class="form-field">
          <label for="quantity">Quantidade de notícias por envio</label>
          <select id="quantity">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label for="keyword-input">Palavras-chave de busca (até 10)</label>
        <div class="keyword-input-row">
          <input type="text" id="keyword-input" placeholder="Digite uma palavra-chave e pressione Enter" />
          <button type="button" id="keyword-add" class="btn btn-primary">Adicionar</button>
        </div>
        <div class="keyword-tags" id="keyword-tags"></div>
        <span class="keyword-count" id="keyword-count">0/10 palavras-chave</span>
      </div>

      <button type="submit" class="btn btn-primary btn-lg">Salvar configuração</button>
      <p class="news-saved-msg" id="news-saved-msg">Configuração salva ✓</p>
      <!-- O site é estático, então a página não grava o news-config.json que
           o robô lê. Esta linha avisa quando a escolha salva aqui ainda não
           foi publicada, em vez de deixar parecer que já está valendo. -->
      <p class="news-sync-msg" id="news-sync-msg"></p>
    </form>

    <div class="news-feed">
      <div class="news-feed-header">
        <p class="news-feed-title">Notícias coletadas (últimas 96h)</p>
        <span class="news-feed-updated" id="news-feed-updated"></span>
      </div>
      <div id="news-feed-list" class="news-feed-list">
        <p class="news-feed-empty">Carregando...</p>
      </div>
    </div>

    <a href="index.html" class="hub-back">&larr; Voltar</a>
  </div>
  <footer class="hub-footer">&copy; <span id="year"></span> gaglidom</footer>
  <script src="script.js?v=202608152041"></script>
  <script src="noticias.js?v=202608152041"></script>
  <script src="news-feed.js?v=202608152041"></script>
</body>
</html>
