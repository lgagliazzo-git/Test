<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gaglidom · Configurar Notícias</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="password-gate.js"></script>
  <style>
    .config-section {
      margin-bottom: 2rem;
    }
    .config-section h3 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      opacity: 0.8;
    }
    .form-group input,
    .form-group select {
      padding: 0.75rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      color: white;
      font-size: 1rem;
    }
    .form-group input::placeholder {
      opacity: 0.5;
    }
    .sources-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .source-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .source-item input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .source-item input:checked ~ label {
      color: #ff6b6b;
      font-weight: bold;
    }
    .source-item:has(input:checked) {
      background: rgba(255, 107, 107, 0.15);
      border-left: 3px solid #ff6b6b;
    }
    .source-item label {
      cursor: pointer;
      flex: 1;
      margin: 0;
    }
    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }
    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: #0066cc;
      color: white;
    }
    .btn-primary:hover {
      background: #0052a3;
    }
    .btn-secondary {
      background: transparent;
      color: #0066cc;
      border: 1px solid #0066cc;
    }
    .btn-secondary:hover {
      background: rgba(0,102,204,0.1);
    }
    .status {
      padding: 1rem;
      border-radius: 4px;
      margin-top: 1rem;
      display: none;
    }
    .status.success {
      display: block;
      background: rgba(76, 175, 80, 0.2);
      color: #4CAF50;
      border: 1px solid #4CAF50;
    }
    .status.error {
      display: block;
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
      border: 1px solid #f44336;
    }
    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .sources-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="hub hub-full">
    <a href="index.html" class="hub-logo">gagli<span>dom</span></a>
    <p class="hub-page-title">📰 Configurar Notícias</p>

    <form id="configForm" style="max-width: 100%;">
      <!-- Quantidade e Frequência -->
      <div class="config-section">
        <h3>📊 Configurações de Busca</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Quantidade de notícias por busca</label>
            <input type="number" id="quantity" name="quantity" min="1" max="20" value="2" />
          </div>
          <div class="form-group">
            <label>Frequência de atualização (horas)</label>
            <input type="number" id="frequency" name="frequency" min="0.5" step="0.5" max="24" value="1" />
          </div>
        </div>
      </div>

      <!-- Fontes -->
      <div class="config-section">
        <h3>📡 Selecione as Fontes</h3>
        <div class="sources-list" id="sourcesContainer"></div>
      </div>

      <!-- Keywords -->
      <div class="config-section">
        <h3>🔍 Palavras-chave (opcional)</h3>
        <div class="form-group">
          <label>Separadas por vírgula</label>
          <input type="text" id="keywords" name="keywords" placeholder="ex: economia, mercado" />
        </div>
      </div>

      <!-- Botões -->
      <div class="button-group">
        <button type="submit" class="btn btn-primary">💾 Salvar Configuração</button>
        <button type="reset" class="btn btn-secondary">🔄 Restaurar</button>
      </div>

      <div id="status" class="status"></div>
    </form>

    <!-- Notícias coletadas -->
    <div id="newsSection" style="margin-top: 3rem;"></div>

    <a href="index.html" class="hub-back">&larr; Voltar</a>
  </div>

  <script>
    const CONFIG_URL = "news-config.json?" + Date.now();
    const allSources = [
      "InfoMoney", "G1", "CNN Brasil", "Poder360", "Tecmundo", "Canaltech",
      "Exame", "Estadão", "UOL", "Valor Econômico", "Money Times", "Brazil Journal",
      "Neofeed", "Suno Notícias", "Seu Dinheiro", "Bloomberg Línea Brasil",
      "Folha de S.Paulo", "Quem (Globo)", "Purepeople", "Contigo", "LeoDias", "GE Globo Esporte"
    ];

    function renderSources(selectedSources) {
      const container = document.getElementById("sourcesContainer");
      container.innerHTML = "";

      allSources.forEach((source) => {
        const isSelected = selectedSources.includes(source);

        const label = document.createElement("div");
        label.className = "source-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = `source-${source}`;
        checkbox.value = source;
        checkbox.checked = isSelected;

        const labelEl = document.createElement("label");
        labelEl.htmlFor = `source-${source}`;
        labelEl.textContent = source;

        label.appendChild(checkbox);
        label.appendChild(labelEl);
        container.appendChild(label);
      });
    }

    async function loadConfig() {
      try {
        const response = await fetch(CONFIG_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const config = await response.json();

        document.getElementById("quantity").value = config.quantity || 2;
        document.getElementById("frequency").value = config.frequency || 1;
        document.getElementById("keywords").value = (config.keywords || []).join(", ");

        renderSources(config.sources || allSources);
      } catch (err) {
        console.error("Erro:", err);
        document.getElementById("quantity").value = 2;
        document.getElementById("frequency").value = 1;
        renderSources(allSources);
      }
    }

    async function loadNews() {
      try {
        const response = await fetch("news/news.json");
        const data = await response.json();

        const newsSection = document.getElementById("newsSection");
        if (data.articles && data.articles.length > 0) {
          let html = `<p><strong>Notícias coletadas (últimas 96h)</strong> — Atualizado há <span id="updateTime">-</span></p>`;

          data.articles.slice(0, 5).forEach(article => {
            html += `
              <a href="${article.link}" target="_blank" class="hub-back" style="display: block; margin-bottom: 0.5rem;">
                <span style="color: #0066cc;">${article.source}</span><br>
                ${article.title}
              </a>
            `;
          });

          newsSection.innerHTML = html;

          // Calcular tempo desde atualização
          const lastUpdate = new Date(data.updatedAt);
          const now = new Date();
          const diffMin = Math.floor((now - lastUpdate) / 60000);
          const timeStr = diffMin < 60 ? `${diffMin} min` : `${Math.floor(diffMin/60)}h`;
          document.getElementById("updateTime").textContent = timeStr;
        }
      } catch (err) {
        console.error("Erro ao carregar notícias:", err);
      }
    }

    document.getElementById("configForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const quantity = parseInt(document.getElementById("quantity").value) || 2;
      const frequency = parseFloat(document.getElementById("frequency").value) || 1;
      const keywords = document.getElementById("keywords").value
        .split(",").map(k => k.trim()).filter(k => k);

      const selectedSources = Array.from(document.querySelectorAll(".source-item input:checked"))
        .map(input => input.value);

      const config = {
        sources: selectedSources,
        categories: [],
        keywords: keywords,
        quantity: quantity,
        frequency: frequency
      };

      try {
        const response = await fetch(CONFIG_URL.split("?")[0], {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(config)
        });

        const status = document.getElementById("status");
        if (response.ok || response.status === 200) {
          status.className = "status success";
          status.textContent = `✅ Salvo! ${quantity} notícia(s) a cada ${frequency}h com ${selectedSources.length} fontes`;
          setTimeout(() => status.style.display = "none", 3000);
        } else {
          status.className = "status error";
          status.textContent = "❌ Erro ao salvar";
        }
      } catch (err) {
        const status = document.getElementById("status");
        status.className = "status error";
        status.textContent = `❌ ${err.message}`;
      }
    });

    loadConfig();
    loadNews();
  </script>
</body>
</html>
