name: Market snapshot

on:
  schedule:
    # 18h00 BRT = 21h00 UTC (o Brasil não usa mais horário de verão)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só gera o print e mostra o diagnóstico, sem mandar no WhatsApp"
        type: boolean
        default: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/landing-page-domain-esf6bn

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Send market snapshot
        if: env.WHATSAPP_TOKEN != ''
        run: npm run market-snapshot

      - name: Registra o resultado do dia
        if: always()
        run: |
          if [ -n "$(git status --porcelain news/market-log.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news/market-log.json
            git commit -m "Registra envio do snapshot de mercado"
            git push
          fi

      - name: Upload snapshot for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-snapshot-png
          path: /tmp/gaglidom-market-snapshot.png
          if-no-files-found: ignore
          retention-days: 3
