name: Market snapshot

on:
  schedule:
    # 19h00 BRT = 22h00 UTC (o Brasil não usa mais horário de verão)
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/landing-page-domain-esf6bn

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send market snapshot
        if: env.WHATSAPP_TOKEN != ''
        run: npm run market-snapshot
