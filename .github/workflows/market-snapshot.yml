name: Market snapshot

on:
  schedule:
    # 18h00 BRT = 21h00 UTC (o Brasil não usa mais horário de verão)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só gera o print e mostra o diagnóstico, sem mandar no WhatsApp"
        type: boolean
        default: false

# Sem isso o passo que grava news/market-log.json leva 403 no push, e o log
# do envio nunca chega no repositório — o que faria a conferência das 9h
# acusar "não rodou" todo dia, mesmo com o envio tendo saído.
permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Envio via WhatsApp Web (Baileys), não mais a Cloud API da Meta — ver
      # scripts/baileys-login.js e o workflow "Baileys login" para gerar
      # WHATSAPP_BAILEYS_AUTH.
      WHATSAPP_BAILEYS_AUTH: ${{ secrets.WHATSAPP_BAILEYS_AUTH }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/landing-page-domain-esf6bn

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Send market snapshot
        if: env.WHATSAPP_BAILEYS_AUTH != ''
        run: npm run market-snapshot

      - name: Registra o resultado do dia
        if: always()
        run: |
          if [ -n "$(git status --porcelain news/market-log.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news/market-log.json
            git commit -m "Registra envio do snapshot de mercado"
            # O robô de notícias commita no mesmo branch o tempo todo, então o
            # push perde a corrida de vez em quando. Rebase e tenta de novo.
            for tentativa in 1 2 3; do
              git push && exit 0
              git pull --rebase origin claude/landing-page-domain-esf6bn
            done
            echo "Não consegui gravar o log do envio depois de 3 tentativas."
            exit 1
          fi

      - name: Upload snapshot for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-snapshot-png
          path: /tmp/gaglidom-market-snapshot.png
          if-no-files-found: ignore
          retention-days: 3
