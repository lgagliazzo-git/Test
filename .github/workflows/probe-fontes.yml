name: Probe fontes

# Temporário, só manual: testa de dentro do Actions quais fontes de taxa de
# título público respondem, já que daqui de fora não dá para alcançar
# nenhuma delas. Sai do repositório assim que a fonte estiver escolhida.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/probe-fontes.js
