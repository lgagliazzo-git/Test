name: Fetch news

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/landing-page-domain-esf6bn

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run fetch-news

      - name: Commit updated news
        run: |
          git config user.name "gaglidom-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/news.json
          git diff --staged --quiet || git commit -m "Atualiza notícias"
          git push
