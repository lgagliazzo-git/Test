name: Fetch news

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Envio via WhatsApp Web (Baileys), não mais a Cloud API da Meta — ver
      # scripts/baileys-login.js e o workflow "Baileys login" para gerar
      # WHATSAPP_BAILEYS_AUTH.
      WHATSAPP_BAILEYS_AUTH: ${{ secrets.WHATSAPP_BAILEYS_AUTH }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/landing-page-domain-esf6bn

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run fetch-news

      # Só envia se a sessão estiver configurada nos secrets do repositório.
      # Sem ela o passo é pulado e a coleta segue funcionando normalmente.
      # (o contexto `secrets` não é permitido em `if`, por isso o teste é no env)
      #
      # continue-on-error: se o WhatsApp falhar (sessão dessincronizada,
      # etc.) isso não pode travar o commit da coleta — sem isso, um problema
      # só no envio também parava as notícias de aparecerem no site.
      - name: Send top story to WhatsApp
        if: env.WHATSAPP_BAILEYS_AUTH != ''
        continue-on-error: true
        run: npm run send-whatsapp

      - name: Commit updated news
        run: |
          git config user.name "gaglidom-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/news.json
          git diff --staged --quiet || git commit -m "Atualiza notícias"
          git push
